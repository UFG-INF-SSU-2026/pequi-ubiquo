<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TowerAI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="brand">🗼 TowerAI</span>
    {% if current_user %}
      <span class="spacer"></span>
      <span class="who">{{ current_user['username'] }}</span>
      <a class="btn" href="{{ url_for('auth.logout') }}">Logout</a>
    {% endif %}
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, msg in messages %}<li class="flash {{ category }}">{{ msg }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>{% block content %}{% endblock %}</main>
</body>
</html>
